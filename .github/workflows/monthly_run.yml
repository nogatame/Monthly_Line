name: Monthly Automation

on:
  schedule:
    - cron: '0 1 5 * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyotp playwright firebase-admin line-bot-sdk
          pip install python-dotenv
          playwright install --with-deps chromium

      - name: Create Service Account JSON
        run: |
          echo "${{ secrets.FIREBASE_SERVICE_ACCOUNT }}" | base64 --decode > service-account.json

      - name: Run script
        env:
          LONG_PASSWORD: ${{ secrets.LONG_PASSWORD }}
          TOTP_OMU: ${{ secrets.TOTP_OMU }}
          LINE_ACCESS_TOKEN: ${{ secrets.LINE_ACCESS_TOKEN }}
        run: python send_line.py
      - name: Keepalive (Safe Empty Commit)
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git checkout main
          git commit --allow-empty -m "chore: keepalive [skip ci]"
          git push origin main